[package]
name = "ocppd"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[features]
vendored = ["ocppd-core/vendored", "native-tls/vendored"]

[dependencies]
futures-util = "0.3.34"
native-tls = "0.2"
ocppd-core = { path = "../ocppd-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "io-std", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "process", "rt-multi-thread"] }
